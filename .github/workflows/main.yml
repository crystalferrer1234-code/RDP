name: Ubuntu RDP y SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Instalar entorno gráfico ligero (XFCE) y xRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Crear contraseña segura para el usuario runner
        run: |
          PASSWORD=$(openssl rand -base64 12)
          echo "runner:$PASSWORD" | sudo chpasswd
          echo "UBUNTU_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Instalar y conectar Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=ubuntu-runner-${{ github.run_id }} --ssh

      - name: Obtener IP de Tailscale
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Mostrar credenciales de acceso
        run: |
          echo "=========================================="
          echo "IP de Tailscale : $TAILSCALE_IP"
          echo "Usuario         : runner"
          echo "Contraseña      : $UBUNTU_PASS"
          echo "------------------------------------------"
          echo "Para RDP: Usa Escritorio Remoto de Windows con esa IP"
          echo "Para SSH: ssh runner@$TAILSCALE_IP"
          echo "=========================================="

      - name: Mantener la sesión activa
        run: |
          while true; do
            echo "[$(date)] Servidor Ubuntu activo..."
            sleep 300
          done
