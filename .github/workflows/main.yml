name: Ubuntu RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 netcat-openbsd
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP User with Secure Password
        run: |
          PASSWORD=$(openssl rand -base64 12)
          sudo useradd -m -s /bin/bash Skyro
          echo "Skyro:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo Skyro
          echo "xfce4-session" | sudo tee /home/Skyro/.xsession > /dev/null
          sudo chown Skyro:Skyro /home/Skyro/.xsession
          echo "RDP_CREDS=User: Skyro | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-ubuntu-${{ github.run_id }}

      - name: Get Tailscale IP & Verify RDP
        run: |
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP not assigned."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"
          
          if ! nc -zv $TS_IP 3389; then
              echo "Error: TCP connection to RDP port 3389 failed"
              exit 1
          fi
          echo "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          echo -e "\n=== RDP ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "$RDP_CREDS"
          echo -e "==================\n"
          
          while true; do
              echo "[$(date)] Ubuntu RDP Active - Cancel workflow in GitHub to terminate"
              sleep 300
          done
